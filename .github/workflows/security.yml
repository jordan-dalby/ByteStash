name: Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- STATIC PHASE ----------
  # Source-level scans. No running app. Run in parallel.

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/javascript
            p/typescript
            p/react
            p/nodejs
            p/owasp-top-ten
  trivy:
    name: Dependencies (Trivy)
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: gitleaks dir . --verbose --exit-code 1

  # ---------- STATIC PHASE GATE ----------
  # "The static phase has completed." The dynamic phase will hang off this.

  static-summary:
    name: Static phase summary
    runs-on: ubuntu-latest
    needs: [semgrep, trivy, gitleaks]
    if: always()
    steps:
      - name: Report static phase result
        run: |
          echo "Static phase finished."
          echo "Semgrep:  ${{ needs.semgrep.result }}"
          echo "Trivy:    ${{ needs.trivy.result }}"
          echo "Gitleaks: ${{ needs.gitleaks.result }}"

  # ---------- DYNAMIC PHASE (proof of plumbing) ----------
  dynamic-smoke:
    name: Dynamic plumbing test
    runs-on: ubuntu-latest
    needs: static-summary
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm docker is available
        run: docker version

      - name: Start a throwaway nginx
        run: |
          docker run -d --name smoke-nginx -p 8080:80 nginx:alpine
          echo "Waiting for nginx to answer..."
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "nginx is up."
              break
            fi
            echo "  attempt $i, not ready yet"
            sleep 1
          done

      - name: Prove we can reach it
        run: |
          curl -fsS http://localhost:8080 | head -5
          echo "Reached nginx successfully."

      - name: Tear down
        if: always()
        run: |
          docker rm -f smoke-nginx || true
          echo "Cleaned up."
