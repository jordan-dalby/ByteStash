name: Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- STATIC PHASE ----------
  # Source-level scans. No running app. Run in parallel.

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/javascript
            p/typescript
            p/react
            p/nodejs
            p/owasp-top-ten
  trivy:
    name: Dependencies (Trivy)
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: gitleaks dir . --verbose --exit-code 1

  # ---------- STATIC PHASE GATE ----------
  # "The static phase has completed." The dynamic phase will hang off this.

  static-summary:
    name: Static phase summary
    runs-on: ubuntu-latest
    needs: [semgrep, trivy, gitleaks]
    if: always()
    steps:
      - name: Report static phase result
        run: |
          echo "Static phase finished."
          echo "Semgrep:  ${{ needs.semgrep.result }}"
          echo "Trivy:    ${{ needs.trivy.result }}"
          echo "Gitleaks: ${{ needs.gitleaks.result }}"

# ---------- DYNAMIC PHASE: deploy the hardened stack ----------
  dynamic-deploy:
    name: Dynamic deploy (hardened stack)
    runs-on: ubuntu-latest
    needs: static-summary
    if: always()                        # Runs regardless of static findings
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm docker is available
        run: docker version

      - name: Generate ephemeral cert + secret, fix config perms
        working-directory: ci
        run: |
          mkdir -p certs secrets
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout certs/bytestash.key -out certs/bytestash.crt \
            -days 1 -subj "/CN=bytestash.local" \
            -addext "subjectAltName=DNS:bytestash.local"
          openssl rand -hex 32 > secrets/jwt_secret
          chmod 644 certs/bytestash.key certs/bytestash.crt secrets/jwt_secret
          chmod 644 nginx/default.conf.template nginx/bytestash_proxy.inc \
                    modsec/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf

      - name: Create and chown volumes
        working-directory: ci
        run: |
          docker compose -f docker-compose.ci.yaml up --no-start
          docker run --rm -v bytestashci_bytestash-data:/data alpine chown -R 1000:1000 /data
          docker run --rm -v bytestashci_waf-logs:/logs alpine chown -R 101:101 /logs

      - name: Bring up the hardened stack
        working-directory: ci
        run: docker compose -f docker-compose.ci.yaml up -d --wait

      - name: Show status
        working-directory: ci
        run: docker compose -f docker-compose.ci.yaml ps

      - name: Tear down
        if: always()                    # guaranteed cleanup even on failure
        working-directory: ci
        run: docker compose -f docker-compose.ci.yaml down -v || true
