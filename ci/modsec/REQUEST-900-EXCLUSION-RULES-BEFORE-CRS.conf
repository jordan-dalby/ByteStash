# ByteStash CRS tuning and request filters.
#
# Mounted at /opt/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf,
# the upstream-documented tuning entry point, loaded before the CRS rules.
#
# Rule IDs use the local 10000-10099 range. CRS reserves 900000-999999.
#
# Two sections:
#   1. CRS tuning, without which the application does not work.
#   2. Request filters that compensate for input handling the application
#      does not perform.

# =================================================================
# SECTION 1: CRS tuning
#
# Read this before assuming the WAF protects the snippet data path.
# It does not, and it cannot.
# =================================================================
#
# ByteStash exists to store arbitrary source code. CRS exists to reject
# requests that look like source code. At PL1 a perfectly legitimate snippet
# containing  ' OR 1=1--  ,  <script>alert(1)</script>  or  ; rm -rf /
# scores past the inbound anomaly threshold and is rejected with a 403.
#
# The injection rule families must therefore be disabled for the snippet write
# paths. This is not a workaround. It is the honest consequence of placing a
# generic WAF in front of a code repository:
#
#   THIS DEPLOYMENT PROVIDES NO WAF INJECTION PROTECTION ON /api/snippets OR /mcp.
#
# What makes that acceptable rather than reckless:
#   - server/src/repositories/snippetRepository.js uses prepared statements
#     throughout. Snippet content never reaches a query parser.
#   - Snippet content is rendered client-side and is covered by CSP.
#   - The exclusion is scoped to snippet paths only. Authentication endpoints
#     keep full CRS coverage.
#
# If you narrow this later, test with snippets containing real SQL, shell and
# JavaScript before deciding it works.

SecRule REQUEST_URI "@rx ^/api/snippets" \
    "id:10010,\
     phase:1,\
     t:none,\
     pass,\
     nolog,\
     msg:'CRS tuning: injection rules disabled for snippet content',\
     tag:'bytestash-crs-tuning',\
     ctl:ruleRemoveByTag=attack-sqli,\
     ctl:ruleRemoveByTag=attack-xss,\
     ctl:ruleRemoveByTag=attack-rce,\
     ctl:ruleRemoveByTag=attack-lfi,\
     ctl:ruleRemoveByTag=attack-rfi,\
     ctl:ruleRemoveByTag=attack-injection-php,\
     ctl:ruleRemoveByTag=attack-injection-generic,\
     ctl:ruleRemoveByTag=attack-java,\
     ctl:ruleRemoveByTag=attack-nodejs,\
     ctl:ruleRemoveByTag=attack-protocol"

# The MCP endpoint carries the same snippet payloads as JSON-RPC
# (create_snippet, update_snippet), so it needs the same treatment.
SecRule REQUEST_URI "@beginsWith /mcp" \
    "id:10011,\
     phase:1,\
     t:none,\
     pass,\
     nolog,\
     msg:'CRS tuning: injection rules disabled for MCP snippet payloads',\
     tag:'bytestash-crs-tuning',\
     ctl:ruleRemoveByTag=attack-sqli,\
     ctl:ruleRemoveByTag=attack-xss,\
     ctl:ruleRemoveByTag=attack-rce,\
     ctl:ruleRemoveByTag=attack-lfi,\
     ctl:ruleRemoveByTag=attack-rfi,\
     ctl:ruleRemoveByTag=attack-injection-php,\
     ctl:ruleRemoveByTag=attack-injection-generic,\
     ctl:ruleRemoveByTag=attack-java,\
     ctl:ruleRemoveByTag=attack-nodejs,\
     ctl:ruleRemoveByTag=attack-protocol"

# =================================================================
# SECTION 2: Request filters
# =================================================================

# --- password length ---------------------------------------------
# Passwords are passed to bcrypt with no length check, and bcrypt silently
# ignores everything beyond the first 72 bytes. Two passwords sharing their
# first 72 bytes authenticate the same account, and the application gives no
# indication that the remainder was discarded. (CWE-521)
#
# t:length yields the byte count, which is what bcrypt truncates on, rather
# than the character count.
#
# TRADE-OFF: passwords longer than 72 bytes are rejected with a 400 instead of
# being silently truncated. No working credential is lost, because those bytes
# never contributed to authentication.
#
# The application-side fix is to cap password length at or below 72 bytes with
# a clear message, or to pre-hash before bcrypt.
SecRule REQUEST_URI "@rx ^/api/auth/(login|register|change-password)" \
    "id:10001,\
     phase:2,\
     t:none,\
     deny,\
     status:400,\
     log,\
     msg:'Password exceeds the bcrypt 72-byte limit',\
     logdata:'uri=%{REQUEST_URI}',\
     tag:'bytestash-filter',\
     tag:'CWE-521',\
     chain"
    SecRule ARGS:json.password|ARGS:json.newPassword|ARGS:json.currentPassword "@gt 72" \
        "t:length"

# --- API documentation -------------------------------------------
# Defence in depth. nginx already returns 404 for /api-docs; this survives a
# location mistake in the proxy config.
SecRule REQUEST_URI "@beginsWith /api-docs" \
    "id:10002,\
     phase:1,\
     t:none,\
     deny,\
     status:404,\
     log,\
     msg:'Unauthenticated API documentation access blocked',\
     tag:'bytestash-filter'"

# --- forwarded header tampering ----------------------------------
# nginx overwrites these before proxying, so the application is already
# protected. This rule records attempts, giving visibility into a class of
# probe the application itself cannot log. Detection only: legitimate upstream
# proxies may set these headers.
SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx .+" \
    "id:10003,\
     phase:1,\
     t:none,\
     pass,\
     log,\
     msg:'Client-supplied X-Forwarded-Host observed and overwritten',\
     logdata:'value=%{MATCHED_VAR}',\
     tag:'bytestash-filter'"

# --- JWT alg:none downgrade --------------------------------------
# eyJhbGciOiJub25lI is base64url for {"alg":"none"
# jsonwebtoken rejects these by default; this makes the attempt visible rather
# than letting it fail silently as an anonymous 403. (CWE-347)
SecRule REQUEST_HEADERS:bytestashauth|REQUEST_HEADERS:Authorization|REQUEST_COOKIES:bytestash_token "@contains eyJhbGciOiJub25lI" \
    "id:10004,\
     phase:1,\
     t:none,\
     deny,\
     status:401,\
     log,\
     msg:'JWT alg:none downgrade attempt blocked',\
     tag:'bytestash-filter',\
     tag:'CWE-347'"

# --- oversized authentication bodies -----------------------------
# body-parser accepts 2 MB on every route including login. A 2 MB login body is
# never legitimate.
SecRule REQUEST_URI "@rx ^/api/auth/(login|register)" \
    "id:10005,\
     phase:1,\
     t:none,\
     deny,\
     status:413,\
     log,\
     msg:'Oversized authentication request body',\
     tag:'bytestash-filter',\
     chain"
    SecRule REQUEST_HEADERS:Content-Length "@gt 8192" "t:none"
